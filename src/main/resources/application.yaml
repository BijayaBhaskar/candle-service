spring:
  application:
    name: candle-service
  datasource:
    url: jdbc:postgresql://localhost:5432/candle_db
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus